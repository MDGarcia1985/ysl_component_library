facts:
  scope:
    status: documented
    value: Transcription of the local manual; linked PDFs were not used to resolve discrepancies.
    source_refs:
      - manual
  pin_naming:
    status: documented
    value: UNO analog pins use A0-A5 with D14-D19 aliases, following the Uno R3 definition. Expansion keys use CONNECTOR_position,
      with physical_pin scoped to connector. maps_to preserves each expansion table's signal label; mcu_pin or source_function
      preserves its separate port or function column when supplied.
    source_refs:
      - manual
  coverage_gaps__0:
    status: documented
    value: Complete UNO power-header positions, Qwiic positions, JCTL pinout, and camera pinouts are not provided
      in the manual text.
    source_refs:
      - manual
  coverage_gaps__1:
    status: documented
    value: MCU package pin numbers, board revision, and per-pin electrical limits are not specified.
    source_refs:
      - manual
  coverage_gaps__2:
    status: documented
    value: High-speed and carrier signal labels are transcribed as published, without schematic verification.
    source_refs:
      - manual
  related_decision:
    status: documented
    value: DEV-2026-11-19-001
    source_refs:
      - manual
  enrichment_decision:
